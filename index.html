<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      // Polyfill fetch setter on window & Window.prototype to prevent
      // "Cannot set property fetch of #<Window> which has only a getter"
      // in sandboxed iframes or environments with getter-only fetch.
      (function() {
        try {
          var realFetch = window.fetch;
          var activeFetch = typeof realFetch === 'function' ? realFetch.bind(window) : realFetch;

          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && !protoDesc.set && protoDesc.configurable) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return activeFetch;
                },
                set: function(fn) {
                  activeFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          }

          var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!winDesc || (!winDesc.set && winDesc.configurable !== false)) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                activeFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Gracefully continue
        }
      })();
    </script>
